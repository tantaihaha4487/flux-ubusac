name: Package Extensions

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript
        run: |
          node --check chrome/content.js
          node --check chrome/page-hook.js
          node --check chrome/options.js
          node --check firefox/content.js
          node --check firefox/page-hook.js
          node --check firefox/options.js
          node --check console/flux-ubusac-console.js

      - name: Validate manifests
        run: |
          node -e "JSON.parse(require('fs').readFileSync('chrome/manifest.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('firefox/manifest.json', 'utf8'))"

  package-chrome:
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package Chrome extension
        run: |
          mkdir -p dist/chrome
          (cd chrome && zip -r ../dist/chrome/flux-ubusac-chrome.zip manifest.json content.js page-hook.js options.html options.js README.md)

      - name: Upload Chrome package
        uses: actions/upload-artifact@v4
        with:
          name: flux-ubusac-chrome-zip
          path: dist/chrome/flux-ubusac-chrome.zip

  package-firefox:
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package Firefox add-on
        run: |
          mkdir -p dist/firefox
          (cd firefox && zip -r ../dist/firefox/flux-ubusac-firefox.zip manifest.json content.js page-hook.js options.html options.js README.md)

      - name: Upload Firefox package
        uses: actions/upload-artifact@v4
        with:
          name: flux-ubusac-firefox-zip
          path: dist/firefox/flux-ubusac-firefox.zip
